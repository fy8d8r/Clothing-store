{% extends 'auth_base.html' %}
{% block title %}Регистрация{% endblock %}
{% block form %}
  <h2>Создать аккаунт</h2>
  <p class="muted">Логин от 3 символов, пароль от 4</p>
  <form method="post" class="stack">
    {% include '_csrf.html' %}
    <input class="input" name="username" placeholder="Логин" value="{{ username }}" autocomplete="username" required autofocus>
    <input class="input" type="password" name="password" placeholder="Пароль" autocomplete="new-password" required>
    <input class="input" type="password" name="password2" placeholder="Повторите пароль" autocomplete="new-password" required>
    <button class="btn btn-primary block">Зарегистрироваться</button>
    <a class="btn btn-ghost block" href="{{ url_for('login') }}">Уже есть аккаунт</a>
  </form>
{% endblock %}
